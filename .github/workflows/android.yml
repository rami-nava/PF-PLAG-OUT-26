name: Android CI

on:
  pull_request:
    paths:
      - "pf-frontend/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "pf-frontend/**"
      - ".github/workflows/android.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pf-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase for CI
        run: |
          mkdir -p app/src/debug
          printf '%s' '{"project_info":{"project_number":"1234567890","project_id":"ci-tests","storage_bucket":"ci-tests.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:0000000000000000","android_client_info":{"package_name":"com.example.plag_out"}},"api_key":[{"current_key":"ci-test-key"}]}],"configuration_version":"1"}' > app/src/debug/google-services.json
      - name: Unit tests and Android test compilation
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin
